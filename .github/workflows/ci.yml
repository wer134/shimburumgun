name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 스토리 JSON을 먼저 본다. 여기서 깨지면 테스트를 돌릴 필요가 없고,
      # 오류 메시지가 "어느 파일 어느 스토리렛"인지 바로 알려준다.
      - name: Validate story JSON
        run: ./gradlew validateStory

      - name: Test
        run: ./gradlew test

      # 자동 플레이로 끝까지 막히지 않는지 확인한다.
      - name: Smoke play
        run: ./gradlew smoke

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
