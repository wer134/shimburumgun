# 진행 표시줄(<====----> 75% EXECUTING)을 끈다.
#
# 이 프로젝트는 콘솔에 글을 쓰는 게임이다. Gradle의 rich console은 게임 출력과
# 같은 줄을 다투면서 계속 덮어쓰고, 심하면 글자를 먹는다 —
# "형태를 얻은 모양이다.E" 처럼 EXECUTING의 첫 글자가 문장 끝에 박히는 식이다.
#
# plain으로 두면 "> Task :run" 같은 줄만 위에 몇 줄 찍히고 그 뒤로는 게임
# 출력만 남는다. ./gradlew run 으로 바로 플레이할 수 있게 하는 것이 목적이다.
org.gradle.console=plain

# 데몬을 살려 두면 두 번째 실행부터 빌드가 빠르다.
org.gradle.daemon=true
